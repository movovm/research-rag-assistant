name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn --batch-mode verify
      - name: Check committed secrets
        shell: bash
        run: |
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|pcsk_[A-Za-z0-9_-]{20,}|api[-_]?key:[[:space:]]*[^$<{])' -- ':!docs/**' ':!*.example'; then
            echo 'Potential secret found'
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
