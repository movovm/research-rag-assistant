server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: salesmentor
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/salesmentor?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:salesmentor}
    password: ${MYSQL_PASSWORD:salesmentor}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  rag:
    mode: ${RAG_MODE:local}
    top-k: 5
    dense-weight: 0.58
    chunk-min-chars: 180
    chunk-max-chars: 700
    semantic-threshold: 0.18
    memory-max-chars: 4000
    seed-demo-data: true
    cloud:
      dashscope-api-key: ${DASHSCOPE_API_KEY:}
      embedding-model: text-embedding-v3
      chat-model: qwen-plus
      embedding-dimension: 1024
      pinecone-api-key: ${PINECONE_API_KEY:}
      pinecone-host: ${PINECONE_HOST:}
      pinecone-namespace: ${PINECONE_NAMESPACE:research-rag}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.salesmentor: INFO
